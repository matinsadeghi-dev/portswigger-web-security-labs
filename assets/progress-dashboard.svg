<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">PortSwigger Web Security Academy lab progress</title>
  <desc id="desc">33 of 273 labs completed, or 12.1 percent. Apprentice: 13 of 61. Practitioner: 19 of 173. Expert: 1 of 39. Focus areas: SQL injection, access control, path traversal, and web cache deception.</desc>
